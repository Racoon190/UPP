<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello UPP</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; padding: 16px; font: 14px/1.5 system-ui, sans-serif; }
      h1 { margin: 0 0 4px; font-size: 18px; }
      p { margin: 0; opacity: 0.75; }
    </style>
  </head>
  <body>
    <h1>Hello UPP</h1>
    <p id="status">single-file panel, no build, no network</p>
    <script>
      // Accio slot-iframe protocol (verified against app.asar):
      //   host -> iframe: {type:'ui/initialize', payload, peerRenderers, isDark, context}
      //                   {type:'ui/theme', isDark}
      //   iframe -> host: {type:'ui/ready'}  (sets iframeReady, host then sends ui/initialize)
      //                   {type:'ui/resize', height:<number>}  <- height MUST be top-level
      // The host only marks iframe_render success after receiving ui/resize.
      (function () {
        function post(msg) { parent.postMessage(msg, '*'); }
        function sendResize() {
          var h = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
          if (h > 0) post({ type: 'ui/resize', height: h });
        }
        function ready() { post({ type: 'ui/ready' }); sendResize(); }
        window.addEventListener('message', function (event) {
          var msg = event.data || {};
          if (msg.type === 'ui/initialize') {
            var p = msg.payload || {};
            var slotPayload = (p.slot && p.slot.payload) || {};
            var name = p.title || slotPayload.name || 'Hello UPP';
            document.title = name;
            document.getElementById('status').textContent = name + ' · rendered by Accio skill-app';
            ready();
          } else if (msg.type === 'ui/theme') {
            document.documentElement.dataset.theme = msg.isDark ? 'dark' : 'light';
          }
        });
        if (window.ResizeObserver) new ResizeObserver(sendResize).observe(document.body);
        ready();
      })();
    </script>
  </body>
</html>
