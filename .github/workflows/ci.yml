name: upp

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  regression:
    name: regression (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: "release gate (12 steps: spec, build, MCP/CLI, import, polish, ui, conformance, signing, offline, cli)"
        run: node tests/run-all.mjs

  artifacts:
    name: build distributables
    runs-on: ubuntu-latest
    needs: regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: pack + offline bundle (unsigned in CI)
        run: |
          node tools/upp.mjs pack --pkg examples/hello-upp --out dist
          node tools/upp.mjs bundle-offline --pkg examples/hello-upp --out dist --zip
      - uses: actions/upload-artifact@v4
        with:
          name: upp-dist
          path: |
            dist/*.upp
            dist/*.sha256
            dist/offline-*
